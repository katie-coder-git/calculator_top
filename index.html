<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script defer src = "script.js"></script>
</head>
<body>
    <div class = "numStrs">
        <button class = "numStr">0</button>
        <button class = "numStr">1</button>
        <button class = "numStr">2</button>
        <button class = "numStr">3</button>
        <button class = "numStr">4</button>
        <button class = "numStr">5</button>
        <button class = "numStr">6</button>
        <button class = "numStr">7</button>
        <button class = "numStr">8</button>
        <button class = "numStr">9</button>
    </div>
    <div class = "operators">
        <button class = "operator">+</button>
        <button class = "operator">-</button>
        <button class = "operator">x</button>
        <button class = "operator">/</button>
    </div>
    <div>
        <button class = "equal">=</button>
    </div>
    <div class="display"></div>
    <div>
        <button class="clear">clear</button>
    </div>
    
</body>
</html>
